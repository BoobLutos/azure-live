name: hcp-runs

# GitHub Actions uploads the configuration to HCP Terraform (API-driven
# workspaces) instead of HCP pulling it from GitHub.
#
# Pull request -> speculative plan in every affected workspace, summary comment
#                 on the PR, one required check: "hcp-plans".
# Push to main -> configuration upload + run in every affected workspace, in
#                 apply order. Dev applies automatically; platform and prod wait
#                 for Confirm & apply in HCP, exactly as before.
# Manual       -> the same for named workspaces (or "all"), e.g. after a fix.
#
# Built on HashiCorp's tfc-workflows-github actions.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workspaces:
        description: 'Workspaces to upload and run: space-separated names, or "all"'
        required: true
        default: all

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hcp-runs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_CLOUD_ORGANIZATION: ${{ vars.HCP_ORG }}
  TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
  TF_MAX_TIMEOUT: "45m"

jobs:
  affected:
    name: affected workspaces
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.find.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: find
        env:
          REQUESTED: ${{ github.event.inputs.workspaces }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/affected-workspaces.sh | tee -a "$GITHUB_OUTPUT"

  plan:
    name: plan (${{ matrix.workspace }})
    needs: affected
    if: github.event_name == 'pull_request' && needs.affected.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.affected.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v5

      # The whole repo is uploaded (see .terraformignore); the workspace's
      # working directory selects the folder, so ../../modules resolves.
      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: upload
        with:
          workspace: ${{ matrix.workspace }}
          directory: ./
          speculative: true

      - uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: run
        continue-on-error: true # still comment on the PR, then fail below
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      - uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan-output
        if: steps.run.outputs.plan_id != ''
        continue-on-error: true
        with:
          plan: ${{ steps.run.outputs.plan_id }}

      - uses: actions/github-script@v7
        continue-on-error: true # Dependabot PRs get a read-only token; the check below still decides
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
          ADD: ${{ steps.plan-output.outputs.add }}
          CHANGE: ${{ steps.plan-output.outputs.change }}
          DESTROY: ${{ steps.plan-output.outputs.destroy }}
        with:
          script: |
            const { WORKSPACE, RUN_STATUS, RUN_LINK, ADD, CHANGE, DESTROY } = process.env;
            const marker = `<!-- hcp-plan:${WORKSPACE} -->`;
            const ok = RUN_STATUS === 'planned_and_finished';
            const summary = ADD !== '' && ADD !== undefined
              ? `Plan: ${ADD} to add, ${CHANGE} to change, ${DESTROY} to destroy.`
              : 'No plan output.';
            const body = [
              marker,
              `#### ${ok ? '✅' : '❌'} HCP Terraform plan: \`${WORKSPACE}\``,
              '```', summary, '```',
              `Run status: \`${RUN_STATUS || 'unknown'}\` · [Open run in HCP Terraform](${RUN_LINK || '#'})`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail unless the plan finished (includes the OPA policy check)
        if: steps.run.outputs.run_status != 'planned_and_finished'
        env:
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
        run: |
          echo "::error::Run status '${RUN_STATUS}': ${RUN_LINK}"
          exit 1

  # Single required status check, whether 0 or 7 workspaces were affected.
  hcp-plans:
    name: hcp-plans
    needs: [affected, plan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          AFFECTED: ${{ needs.affected.result }}
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "affected: $AFFECTED, plan: $PLAN"
          [[ "$AFFECTED" == "success" && ( "$PLAN" == "success" || "$PLAN" == "skipped" ) ]]

  run:
    name: run (${{ matrix.workspace }})
    needs: affected
    if: github.event_name != 'pull_request' && needs.affected.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # upload in apply order: governance -> management -> connectivity -> spokes
      matrix:
        workspace: ${{ fromJSON(needs.affected.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: upload
        with:
          workspace: ${{ matrix.workspace }}
          directory: ./

      # Creates the run and waits for its plan. Whether it then applies is the
      # workspace's own setting (auto-apply for dev; Confirm & apply otherwise).
      - uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: run
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          message: "${{ github.event_name == 'push' && 'Merge' || 'Manual' }} ${{ github.sha }}"

      - name: Summary
        if: always()
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
        run: |
          echo "| ${WORKSPACE} | \`${RUN_STATUS:-not started}\` | [run](${RUN_LINK:-#}) |" >> "$GITHUB_STEP_SUMMARY"
          case "${RUN_STATUS}" in
            errored|canceled|force_canceled|discarded|policy_soft_failed|"")
              echo "::error::${WORKSPACE}: run status '${RUN_STATUS:-not started}'"; exit 1 ;;
            planned|policy_checked|policy_override|cost_estimated|post_plan_completed)
              echo "::notice::${WORKSPACE}: waiting for Confirm & apply in HCP: ${RUN_LINK}" ;;
          esac
